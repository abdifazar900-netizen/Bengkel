<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BengkelPOS - Cloud Edition</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1048/1048313.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Compiler -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            .thermal-receipt, .thermal-receipt * {
                visibility: visible;
            }
            .thermal-receipt {
                position: absolute;
                left: 0;
                top: 0;
                width: 58mm;
                padding: 2mm 1mm;
                margin: 0;
                font-family: 'Courier New', Courier, monospace;
                font-size: 9px;
                line-height: 1.2;
                color: #000;
                background: #fff;
            }
            .no-print {
                display: none !important;
            }
        }
        
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Hardcode URL Web App Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbzr0SZUGYfn6ym6kiIGSXcSpTpNhciUALiLctr0q7kpP-fQwDtq6PU3yJFnxEuqdcM8LQ/exec";

        const DEFAULT_PRINTER_SETTINGS = {
            printMethod: 'system',
            paperWidth: '58mm',
            autoPrint: true,
            storeName: 'BENGKEL PRO MOTOR',
            storeAddress: 'Jl. Raya Utama No. 88, Jakarta',
            storePhone: '0812-3456-7890',
            receiptFooter: 'Terima kasih atas kunjungan Anda!\nSimpan struk ini sebagai bukti servis.',
            storeLogo: null
        };

        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number || 0);
        };

        function App() {
            const [activeTab, setActiveTab] = useState('pos');
            const [loading, setLoading] = useState(false);
            const [syncing, setSyncing] = useState(false);

            const [products, setProducts] = useState([]);
            const [masterProducts, setMasterProducts] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [printerSettings, setPrinterSettings] = useState(DEFAULT_PRINTER_SETTINGS);

            const [btDevice, setBtDevice] = useState(null);
            const [btStatus, setBtStatus] = useState('Disconnected');

            const [cart, setCart] = useState([]);
            const [customerName, setCustomerName] = useState('');
            const [vehicleInfo, setVehicleInfo] = useState('');
            const [plateNumber, setPlateNumber] = useState('');
            const [paymentMethod, setPaymentMethod] = useState('cash');
            const [cashAmount, setCashAmount] = useState('');
            const [discount, setDiscount] = useState(0);

            const [lastTransaction, setLastTransaction] = useState(null);
            const [showReceiptModal, setShowReceiptModal] = useState(false);
            const [showAddProductModal, setShowAddProductModal] = useState(false);
            const [editingProduct, setEditingProduct] = useState(null);

            const [toast, setToast] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const callApi = async (action, payload = {}) => {
                setSyncing(true);
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action, payload })
                    });
                    const res = await response.json();
                    setSyncing(false);
                    if (res.status === 'success') {
                        return res.data;
                    } else {
                        showToast(res.message || 'Gagal memproses ke database cloud', 'error');
                        return null;
                    }
                } catch (err) {
                    console.error('API Error:', err);
                    setSyncing(false);
                    showToast('Koneksi ke Google Sheets gagal!', 'error');
                    return null;
                }
            };

            /* Load initial data on startup */
            const loadCloudData = async () => {
                setLoading(true);
                try {
                    const response = await fetch(`${API_URL}?action=getAllData`);
                    const res = await response.json();
                    if (res.status === 'success') {
                        if (res.data.products) setProducts(res.data.products);
                        if (res.data.masterProducts) setMasterProducts(res.data.masterProducts);
                        if (res.data.transactions) setTransactions(res.data.transactions);
                        if (res.data.settings) setPrinterSettings(res.data.settings);
                        showToast('Data berhasil disinkronkan!');
                    } else {
                        showToast('Gagal memuat data cloud.', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    showToast('Gagal terhubung ke Google Sheets API.', 'error');
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                loadCloudData();
            }, []);

            const addToCart = (product) => {
                if (product.category !== 'Jasa Servis' && product.stock <= 0) {
                    showToast('Stok produk habis!', 'error');
                    return;
                }
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        if (product.category !== 'Jasa Servis' && existing.qty >= product.stock) {
                            showToast('Stok tidak mencukupi!', 'error');
                            return prev;
                        }
                        return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    }
                    return [...prev, { ...product, qty: 1 }];
                });
            };

            const updateCartQty = (id, delta) => {
                setCart(prev => {
                    return prev.map(item => {
                        if (item.id === id) {
                            const newQty = item.qty + delta;
                            if (newQty <= 0) return null;
                            if (item.category !== 'Jasa Servis' && newQty > item.stock) {
                                showToast('Stok tidak mencukupi!', 'error');
                                return item;
                            }
                            return { ...item, qty: newQty };
                        }
                        return item;
                    }).filter(Boolean);
                });
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const cartSubtotal = useMemo(() => {
                return cart.reduce((sum, item) => sum + (item.sellPrice * item.qty), 0);
            }, [cart]);

            const cartTotal = useMemo(() => {
                return Math.max(0, cartSubtotal - discount);
            }, [cartSubtotal, discount]);

            const changeAmount = useMemo(() => {
                const cash = parseFloat(cashAmount) || 0;
                return Math.max(0, cash - cartTotal);
            }, [cashAmount, cartTotal]);

            /* Bluetooth Direct Scan */
            const handleScanBluetooth = async () => {
                if (!navigator.bluetooth) {
                    showToast('Browser ini tidak mendukung Web Bluetooth API', 'error');
                    return;
                }
                try {
                    setBtStatus('Searching...');
                    const device = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
                    });
                    setBtDevice(device);
                    setBtStatus(`Connected (${device.name || 'Printer'})`);
                    showToast(`Terhubung ke ${device.name || 'Printer Bluetooth'}`);
                } catch (err) {
                    console.error(err);
                    setBtStatus('Disconnected');
                    showToast('Gagal terhubung ke printer Bluetooth', 'error');
                }
            };

            const handleProcessPayment = async () => {
                if (cart.length === 0) {
                    showToast('Keranjang belanja kosong!', 'error');
                    return;
                }
                const cash = parseFloat(cashAmount) || 0;
                if (paymentMethod === 'cash' && cash < cartTotal) {
                    showToast('Uang pembayaran kurang!', 'error');
                    return;
                }

                const newTransaction = {
                    id: 'TRX-' + Date.now().toString().slice(-6),
                    date: new Date().toISOString(),
                    customerName: customerName || 'Pelanggan Umum',
                    vehicleInfo: vehicleInfo || '-',
                    plateNumber: plateNumber ? plateNumber.toUpperCase() : '-',
                    items: [...cart],
                    subtotal: cartSubtotal,
                    discount: discount,
                    total: cartTotal,
                    paymentMethod,
                    cashPaid: paymentMethod === 'cash' ? cash : cartTotal,
                    change: paymentMethod === 'cash' ? changeAmount : 0
                };

                const updatedProducts = products.map(p => {
                    const cartItem = cart.find(c => c.id === p.id);
                    if (cartItem && p.category !== 'Jasa Servis') {
                        return { ...p, stock: Math.max(0, p.stock - cartItem.qty) };
                    }
                    return p;
                });

                setProducts(updatedProducts);
                setTransactions(prev => [newTransaction, ...prev]);
                setLastTransaction(newTransaction);
                setShowReceiptModal(true);

                setCart([]);
                setCustomerName('');
                setVehicleInfo('');
                setPlateNumber('');
                setCashAmount('');
                setDiscount(0);

                await callApi('saveTransaction', { transaction: newTransaction, updatedProducts });

                showToast('Transaksi berhasil disimpan!');

                if (printerSettings.autoPrint) {
                    triggerPrint(newTransaction);
                }
            };

            const triggerPrint = (trx) => {
                if (printerSettings.printMethod === 'system') {
                    setTimeout(() => {
                        window.print();
                    }, 300);
                } else if (printerSettings.printMethod === 'rawbt') {
                    let printText = `${printerSettings.storeName}\n${printerSettings.storeAddress}\nTelp: ${printerSettings.storePhone}\n--------------------------------\n`;
                    printText += `No: ${trx.id}\nTgl: ${new Date(trx.date).toLocaleString('id-ID')}\nPelanggan: ${trx.customerName}\nPlat: ${trx.plateNumber}\n--------------------------------\n`;
                    trx.items.forEach(item => {
                        printText += `${item.name}\n${item.qty} x ${formatRupiah(item.sellPrice)} = ${formatRupiah(item.qty * item.sellPrice)}\n`;
                    });
                    printText += `--------------------------------\nTotal: ${formatRupiah(trx.total)}\nBayar: ${formatRupiah(trx.cashPaid)}\nKembali: ${formatRupiah(trx.change)}\n--------------------------------\n${printerSettings.receiptFooter}\n\n\n`;
                    window.location.href = `intent:#Intent;scheme=rawbt;package=ru.a404.rawbt;S.txt=${encodeURIComponent(printText)};end;`;
                } else {
                    window.print();
                }
            };

            return (
                <div className="flex flex-col md:flex-row min-h-screen">
                    {/* Header Top Nav untuk Layar HP / Potret */}
                    <header className="no-print bg-slate-900 text-slate-300 p-2.5 flex md:hidden items-center justify-between border-b border-slate-800 sticky top-0 z-40">
                        <div className="flex items-center space-x-2">
                            <div className="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center text-white text-xs font-bold">
                                <i className="fa-solid fa-wrench"></i>
                            </div>
                            <h1 className="font-bold text-white text-xs truncate max-w-[110px]">{printerSettings.storeName}</h1>
                        </div>

                        <nav className="flex space-x-1 overflow-x-auto">
                            <button
                                onClick={() => setActiveTab('pos')}
                                className={`px-2.5 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap ${activeTab === 'pos' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                            >
                                <i className="fa-solid fa-cash-register mr-1"></i>Kasir
                            </button>
                            <button
                                onClick={() => setActiveTab('dashboard')}
                                className={`px-2.5 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                            >
                                <i className="fa-solid fa-chart-line mr-1"></i>Omset
                            </button>
                            <button
                                onClick={() => setActiveTab('products')}
                                className={`px-2.5 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap ${activeTab === 'products' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                            >
                                <i className="fa-solid fa-boxes-stacked mr-1"></i>Stok
                            </button>
                            <button
                                onClick={() => setActiveTab('reports')}
                                className={`px-2.5 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap ${activeTab === 'reports' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                            >
                                <i className="fa-solid fa-file-invoice-dollar mr-1"></i>Laporan
                            </button>
                            <button
                                onClick={() => setActiveTab('settings')}
                                className={`px-2.5 py-1.5 rounded-lg text-[10px] font-bold whitespace-nowrap ${activeTab === 'settings' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}
                            >
                                <i className="fa-solid fa-gear mr-1"></i>Opsi
                            </button>
                        </nav>
                    </header>

                    {/* Sidebar Nav Khusus Tablet / PC */}
                    <aside className="no-print bg-slate-900 text-slate-300 w-64 flex-shrink-0 hidden md:flex md:flex-col justify-between p-4 min-h-screen">
                        <div>
                            <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                                <div className="flex items-center space-x-3">
                                    <div className="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-blue-500/30">
                                        <i className="fa-solid fa-wrench"></i>
                                    </div>
                                    <div>
                                        <h1 className="font-bold text-white text-base leading-tight">{printerSettings.storeName}</h1>
                                        <span className="text-[11px] text-blue-400 font-medium">Cloud BengkelPOS</span>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-3 p-2.5 bg-slate-800/80 rounded-xl text-xs flex items-center justify-between">
                                <span className="flex items-center space-x-2">
                                    <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                    <span className="text-slate-300 font-semibold">{syncing ? 'Menyinkronkan...' : 'Cloud Online'}</span>
                                </span>
                                <button onClick={loadCloudData} title="Refresh Data" className="text-slate-400 hover:text-white">
                                    <i className={`fa-solid fa-rotate ${syncing ? 'fa-spin' : ''}`}></i>
                                </button>
                            </div>

                            <nav className="mt-4 flex flex-col space-y-1">
                                <button
                                    onClick={() => setActiveTab('pos')}
                                    className={`flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'pos' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'hover:bg-slate-800 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-cash-register text-lg"></i>
                                    <span>Kasir (POS)</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('dashboard')}
                                    className={`flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'hover:bg-slate-800 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-chart-line text-lg"></i>
                                    <span>Ringkasan Usaha</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('products')}
                                    className={`flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'products' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'hover:bg-slate-800 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-boxes-stacked text-lg"></i>
                                    <span>Stok & Barang</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('reports')}
                                    className={`flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'reports' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'hover:bg-slate-800 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-file-invoice-dollar text-lg"></i>
                                    <span>Laporan Penjualan</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('settings')}
                                    className={`flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition ${activeTab === 'settings' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'hover:bg-slate-800 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-gear text-lg"></i>
                                    <span>Pengaturan</span>
                                </button>
                            </nav>
                        </div>

                        <div className="pt-6 border-t border-slate-800 text-xs text-slate-500">
                            <p className="font-semibold text-slate-400">Metode Cetak:</p>
                            <p className="flex items-center space-x-2 mt-1">
                                <span className={`w-2.5 h-2.5 rounded-full ${printerSettings.printMethod === 'bluetooth' ? 'bg-emerald-500' : 'bg-blue-500'}`}></span>
                                <span className="capitalize">{printerSettings.printMethod} (58mm)</span>
                            </p>
                        </div>
                    </aside>

                    <main className="flex-1 p-2 md:p-6 overflow-y-auto min-h-screen no-print relative">
                        {toast && (
                            <div className={`fixed top-4 right-4 z-50 px-3 py-2 rounded-xl shadow-xl text-white font-semibold text-xs flex items-center space-x-2 transition-all ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                                <i className={`fa-solid ${toast.type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check'}`}></i>
                                <span>{toast.message}</span>
                            </div>
                        )}

                        {loading ? (
                            <div className="flex flex-col items-center justify-center min-h-[60vh] space-y-3">
                                <i className="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600"></i>
                                <p className="font-semibold text-slate-600 text-xs">Memuat Data dari Google Sheets...</p>
                            </div>
                        ) : (
                            <>
                                {activeTab === 'pos' && (
                                    <POSView
                                        products={products}
                                        cart={cart}
                                        addToCart={addToCart}
                                        updateCartQty={updateCartQty}
                                        removeFromCart={removeFromCart}
                                        cartSubtotal={cartSubtotal}
                                        cartTotal={cartTotal}
                                        discount={discount}
                                        setDiscount={setDiscount}
                                        customerName={customerName}
                                        setCustomerName={setCustomerName}
                                        vehicleInfo={vehicleInfo}
                                        setVehicleInfo={setVehicleInfo}
                                        plateNumber={plateNumber}
                                        setPlateNumber={setPlateNumber}
                                        paymentMethod={paymentMethod}
                                        setPaymentMethod={setPaymentMethod}
                                        cashAmount={cashAmount}
                                        setCashAmount={setCashAmount}
                                        changeAmount={changeAmount}
                                        handleProcessPayment={handleProcessPayment}
                                    />
                                )}

                                {activeTab === 'dashboard' && (
                                    <DashboardView
                                        products={products}
                                        transactions={transactions}
                                        setActiveTab={setActiveTab}
                                    />
                                )}

                                {activeTab === 'products' && (
                                    <ProductsView
                                        products={products}
                                        setProducts={setProducts}
                                        masterProducts={masterProducts}
                                        showAddProductModal={showAddProductModal}
                                        setShowAddProductModal={setShowAddProductModal}
                                        editingProduct={editingProduct}
                                        setEditingProduct={setEditingProduct}
                                        callApi={callApi}
                                        showToast={showToast}
                                    />
                                )}

                                {activeTab === 'reports' && (
                                    <ReportsView
                                        transactions={transactions}
                                        setTransactions={setTransactions}
                                        callApi={callApi}
                                        onReprint={(trx) => {
                                            setLastTransaction(trx);
                                            setShowReceiptModal(true);
                                            triggerPrint(trx);
                                        }}
                                        showToast={showToast}
                                    />
                                )}

                                {activeTab === 'settings' && (
                                    <PrinterSettingsView
                                        settings={printerSettings}
                                        setSettings={async (newSettings) => {
                                            setPrinterSettings(newSettings);
                                            await callApi('saveSettings', { settings: newSettings });
                                        }}
                                        btDevice={btDevice}
                                        btStatus={btStatus}
                                        onScanBluetooth={handleScanBluetooth}
                                        onTestPrint={() => {
                                            const testTrx = {
                                                id: 'TEST-001',
                                                date: new Date().toISOString(),
                                                customerName: 'Tes Printer',
                                                vehicleInfo: 'Honda Vario 150',
                                                plateNumber: 'B 1234 ABC',
                                                items: [{ name: 'Oli MPX2 Tes Print', qty: 1, sellPrice: 55000 }],
                                                subtotal: 55000,
                                                discount: 0,
                                                total: 55000,
                                                cashPaid: 60000,
                                                change: 5000
                                            };
                                            setLastTransaction(testTrx);
                                            setShowReceiptModal(true);
                                            triggerPrint(testTrx);
                                        }}
                                    />
                                )}
                            </>
                        )}
                    </main>

                    {showReceiptModal && lastTransaction && (
                        <ReceiptModal
                            transaction={lastTransaction}
                            settings={printerSettings}
                            onTriggerPrint={() => triggerPrint(lastTransaction)}
                            onClose={() => setShowReceiptModal(false)}
                        />
                    )}
                </div>
            );
        }

        function POSView({
            products, cart, addToCart, updateCartQty, removeFromCart,
            cartSubtotal, cartTotal, discount, setDiscount,
            customerName, setCustomerName, vehicleInfo, setVehicleInfo,
            plateNumber, setPlateNumber, paymentMethod, setPaymentMethod,
            cashAmount, setCashAmount, changeAmount, handleProcessPayment
        }) {
            const [search, setSearch] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Semua');

            const categories = useMemo(() => {
                const cats = new Set(products.map(p => p.category));
                return ['Semua', ...Array.from(cats)];
            }, [products]);

            const filteredProducts = useMemo(() => {
                return products.filter(p => {
                    const matchesSearch = p.name.toLowerCase().includes(search.toLowerCase()) || p.code.toLowerCase().includes(search.toLowerCase());
                    const matchesCat = selectedCategory === 'Semua' || p.category === selectedCategory;
                    return matchesSearch && matchesCat;
                });
            }, [products, search, selectedCategory]);

            return (
                /* Dipaksa selalu 2 kolom bersebelahan bahkan di HP potret */
                <div className="grid grid-cols-12 gap-2 md:gap-4">
                    {/* Kolom Kiri: Katalog Produk (7 Kolom) */}
                    <div className="col-span-7 space-y-2">
                        <div className="bg-white p-2 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-1.5">
                            <div className="relative flex-1">
                                <i className="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
                                <input
                                    type="text"
                                    placeholder="Cari sparepart/jasa..."
                                    value={search}
                                    onChange={(e) => setSearch(e.target.value)}
                                    className="w-full pl-8 pr-2 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-[11px] focus:outline-none focus:ring-1 focus:ring-blue-500 font-medium"

                        <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-3">

                                <i className="fa-solid fa-receipt"></i>
                            </div>

        function ProductsView({ products, setProducts, masterProducts, showAddProductModal, setShowAddProductModal, editingProduct, setEditingProduct, callApi, showToast }) {
            const [search, setSearch] = useState('');
            const [formData, setFormData] = useState({
                code: '', name: '', category: 'Suku Cadang', buyPrice: 0, sellPrice: 0, stock: 0, minStock: 5, unit: 'Pcs'
            });

            const openAddModal = () => {
                setEditingProduct(null);
                setFormData({ code: '', name: '', category: 'Suku Cadang', buyPrice: 0, sellPrice: 0, stock: 10, minStock: 5, unit: 'Pcs' });
                setShowAddProductModal(true);
            };

            const openEditModal = (p) => {
                setEditingProduct(p);
                setFormData({ ...p });
                setShowAddProductModal(true);
            };

            const handleSelectMaster = (selectedCode) => {
                const found = masterProducts.find(m => String(m.code) === String(selectedCode));
                if (found) {
                    setFormData(prev => ({
                        ...prev,
                        code: found.code,
                        name: found.name,
                        category: found.category || prev.category
                    }));
                }
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (!formData.name || !formData.code) {
                    showToast('Harap isi kode dan nama item!', 'error');
                    return;
                }

                let updatedProduct;
                if (editingProduct) {
                    updatedProduct = { ...formData, id: editingProduct.id };
                    setProducts(prev => prev.map(p => p.id === editingProduct.id ? updatedProduct : p));
                } else {
                    updatedProduct = { ...formData, id: 'PRD-' + Date.now().toString().slice(-6) };
                    setProducts(prev => [updatedProduct, ...prev]);
                }

                setShowAddProductModal(false);
                await callApi('saveProduct', { product: updatedProduct });
                showToast('Barang berhasil disimpan!');
            };

            const handleDeleteProduct = async (id) => {
                if (window.confirm('Yakin ingin menghapus item ini?')) {
                    setProducts(prev => prev.filter(p => p.id !== id));
                    await callApi('deleteProduct', { id });
                    showToast('Item dihapus');
                }
            };

            const filtered = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.code.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="space-y-3">
                    <div className="flex items-center justify-between">
                        <h2 className="text-base font-bold text-slate-800">Manajemen Stok</h2>
                        <button
                            onClick={openAddModal}
                            className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1"
                        >
                            <i className="fa-solid fa-plus"></i>
                            <span>Tambah Item</span>
                        </button>
                    </div>

                    <div className="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2">
                        <input
                            type="text"
                            placeholder="Cari barang..."
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                            className="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium focus:outline-none"
                        />

                        <div className="overflow-x-auto max-h-[60vh]">
                            <table className="w-full text-left text-[11px]">
                                <thead>
                                    <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-extrabold text-[9px]">
                                        <th className="p-2">Kode</th>
                                        <th className="p-2">Nama</th>
                                        <th className="p-2">Jual</th>
                                        <th className="p-2 text-center">Stok</th>
                                        <th className="p-2 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {filtered.length === 0 ? (
                                        <tr>
                                            <td colSpan="5" className="p-4 text-center text-slate-400">Belum ada barang.</td>
                                        </tr>
                                    ) : (
                                        filtered.map(p => (
                                            <tr key={p.id} className="hover:bg-slate-50">
                                                <td className="p-2 font-bold text-slate-700">{p.code}</td>
                                                <td className="p-2 font-bold text-slate-900">{p.name}</td>
                                                <td className="p-2 font-bold text-blue-600">{formatRupiah(p.sellPrice)}</td>
                                                <td className="p-2 text-center">
                                                    {p.category === 'Jasa Servis' ? '-' : p.stock}
                                                </td>
                                                <td className="p-2 text-center space-x-1">
                                                    <button onClick={() => openEditModal(p)} className="text-blue-600 p-1"><i className="fa-solid fa-pen-to-square"></i></button>
                                                    <button onClick={() => handleDeleteProduct(p.id)} className="text-red-500 p-1"><i className="fa-solid fa-trash"></i></button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {showAddProductModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                            <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full p-4 space-y-3">
                                <div className="flex items-center justify-between border-b pb-2">
                                    <h3 className="font-bold text-slate-800 text-xs">
                                        {editingProduct ? 'Edit Item' : 'Tambah Item Baru'}
                                    </h3>
                                    <button onClick={() => setShowAddProductModal(false)} className="text-slate-400">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <form onSubmit={handleSaveProduct} className="space-y-2 text-[11px]">
                                    {!editingProduct && masterProducts && masterProducts.length > 0 && (
                                        <div className="p-1.5 bg-blue-50 border border-blue-200 rounded-lg">
                                            <select
                                                onChange={(e) => handleSelectMaster(e.target.value)}
                                                className="w-full px-1.5 py-1 bg-white border border-blue-300 rounded text-[10px] font-semibold"
                                            >
                                                <option value="">-- Impor dari Master Sheet --</option>
                                                {masterProducts.map((m, idx) => (
                                                    <option key={idx} value={m.code}>
                                                        [{m.code}] {m.name}
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-600 font-semibold mb-0.5">Kode</label>
                                            <input
                                                type="text"
                                                required
                                                value={formData.code}
                                                onChange={(e) => setFormData({ ...formData, code: e.target.value })}
                                                className="w-full px-2 py-1 border rounded font-semibold"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-600 font-semibold mb-0.5">Kategori</label>
                                            <select
                                                value={formData.category}
                                                onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                                                className="w-full px-2 py-1 border rounded font-semibold bg-white"
                                            >
                                                <option value="Suku Cadang">Suku Cadang</option>
                                                <option value="Oli & Pelumas">Oli & Pelumas</option>
                                                <option value="Aki & Kelistrikan">Aki & Kelistrikan</option>
                                                <option value="Ban & Velg">Ban & Velg</option>
                                                <option value="Jasa Servis">Jasa Servis</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-slate-600 font-semibold mb-0.5">Nama Item</label>
                                        <input
                                            type="text"
                                            required
                                            value={formData.name}
                                            onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                            className="w-full px-2 py-1 border rounded font-semibold"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-slate-600 font-semibold mb-0.5">Modal (Rp)</label>
                                            <input
                                                type="number"
                                                value={formData.buyPrice}
                                                onChange={(e) => setFormData({ ...formData, buyPrice: parseFloat(e.target.value) || 0 })}
                                                className="w-full px-2 py-1 border rounded font-semibold"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-600 font-semibold mb-0.5">Jual (Rp)</label>
                                            <input
                                                type="number"
                                                required
                                                value={formData.sellPrice}
                                                onChange={(e) => setFormData({ ...formData, sellPrice: parseFloat(e.target.value) || 0 })}
                                                className="w-full px-2 py-1 border rounded font-semibold text-blue-600"
                                            />
                                        </div>
                                    </div>

                                    {formData.category !== 'Jasa Servis' && (
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="block text-slate-600 font-semibold mb-0.5">Stok</label>
                                                <input
                                                    type="number"
                                                    value={formData.stock}
                                                    onChange={(e) => setFormData({ ...formData, stock: parseInt(e.target.value) || 0 })}
                                                    className="w-full px-2 py-1 border rounded font-semibold"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-slate-600 font-semibold mb-0.5">Satuan</label>
                                                <input
                                                    type="text"
                                                    value={formData.unit}
                                                    onChange={(e) => setFormData({ ...formData, unit: e.target.value })}
                                                    className="w-full px-2 py-1 border rounded font-semibold"
                                                />
                                            </div>
                                        </div>
                                    )}

                                    <div className="pt-2 flex space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowAddProductModal(false)}
                                            className="flex-1 py-1.5 bg-slate-100 text-slate-700 font-bold rounded-lg"
                                        >
                                            Batal
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 py-1.5 bg-blue-600 text-white font-bold rounded-lg"
                                        >
                                            Simpan
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function ReportsView({ transactions, setTransactions, callApi, onReprint, showToast }) {
            const handleDeleteTrx = async (id) => {
                if (window.confirm('Hapus transaksi ini?')) {
                    setTransactions(prev => prev.filter(t => t.id !== id));
                    await callApi('deleteTransaction', { id });
                    showToast('Transaksi dihapus');
                }
            };

            const totalRevenue = useMemo(() => {
                return transactions.reduce((sum, t) => sum + (parseFloat(t.total) || 0), 0);
            }, [transactions]);

            return (
                <div className="space-y-3">
                    <div className="flex items-center justify-between">
                        <h2 className="text-base font-bold text-slate-800">Laporan Penjualan</h2>
                        <span className="text-xs font-extrabold text-blue-600">{formatRupiah(totalRevenue)}</span>
                    </div>

                    <div className="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                        <div className="overflow-x-auto max-h-[65vh]">
                            <table className="w-full text-left text-[11px]">
                                <thead>
                                    <tr className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-extrabold text-[9px]">
                                        <th className="p-2">Nota</th>
                                        <th className="p-2">Pelanggan</th>
                                        <th className="p-2">Total</th>
                                        <th className="p-2 text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {transactions.length === 0 ? (
                                        <tr>
                                            <td colSpan="4" className="p-4 text-center text-slate-400">Belum ada transaksi.</td>
                                        </tr>
                                    ) : (
                                        transactions.map(t => (
                                            <tr key={t.id} className="hover:bg-slate-50">
                                                <td className="p-2 font-bold text-slate-800">{t.id}</td>
                                                <td className="p-2">
                                                    <span className="font-bold block truncate max-w-[80px]">{t.customerName}</span>
                                                    <span className="text-[9px] text-slate-400">{t.plateNumber}</span>
                                                </td>
                                                <td className="p-2 font-bold text-blue-600">{formatRupiah(t.total)}</td>
                                                <td className="p-2 text-center space-x-1">
                                                    <button onClick={() => onReprint(t)} className="bg-blue-50 text-blue-600 p-1 rounded"><i className="fa-solid fa-print"></i></button>
                                                    <button onClick={() => handleDeleteTrx(t.id)} className="text-red-500 p-1"><i className="fa-solid fa-trash"></i></button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        function PrinterSettingsView({ settings, setSettings, btDevice, btStatus, onScanBluetooth, onTestPrint }) {
            const handleChange = (field, value) => {
                setSettings({ ...settings, [field]: value });
            };

            return (
                <div className="space-y-4 max-w-xl">
                    <h2 className="text-base font-bold text-slate-800">Pengaturan</h2>

                    <div className="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-3">
                        <h3 className="font-bold text-slate-800 text-xs border-b pb-1.5 flex items-center space-x-1">
                            <i className="fa-solid fa-print text-blue-600"></i>
                            <span>Metode Cetak</span>
                        </h3>

                        <div className="grid grid-cols-3 gap-2">
                            <div
                                onClick={() => handleChange('printMethod', 'system')}
                                className={`p-2 rounded-lg border cursor-pointer text-center ${settings.printMethod === 'system' ? 'border-blue-600 bg-blue-50' : 'border-slate-200'}`}
                            >
                                <span className="font-bold text-[11px] block">System</span>
                            </div>

                            <div
                                onClick={() => handleChange('printMethod', 'bluetooth')}
                                className={`p-2 rounded-lg border cursor-pointer text-center ${settings.printMethod === 'bluetooth' ? 'border-blue-600 bg-blue-50' : 'border-slate-200'}`}
                            >
                                <span className="font-bold text-[11px] block">Bluetooth</span>
                            </div>

                            <div
                                onClick={() => handleChange('printMethod', 'rawbt')}
                                className={`p-2 rounded-lg border cursor-pointer text-center ${settings.printMethod === 'rawbt' ? 'border-blue-600 bg-blue-50' : 'border-slate-200'}`}
                            >
                                <span className="font-bold text-[11px] block">RawBT</span>
                            </div>
                        </div>

                        {settings.printMethod === 'bluetooth' && (
                            <div className="p-2 bg-slate-50 rounded-lg border flex items-center justify-between text-xs">
                                <span>{btStatus}</span>
                                <button onClick={onScanBluetooth} className="bg-blue-600 text-white font-bold text-[10px] px-2.5 py-1 rounded">
                                    Pindai
                                </button>
                            </div>
                        )}

                        <div className="flex items-center justify-between pt-1">
                            <label className="flex items-center space-x-1 text-[11px] font-bold text-slate-700">
                                <input
                                    type="checkbox"
                                    checked={settings.autoPrint}
                                    onChange={(e) => handleChange('autoPrint', e.target.checked)}
                                    className="w-3.5 h-3.5 text-blue-600 rounded"
                                />
                                <span>Cetak Otomatis</span>
                            </label>

                            <button onClick={onTestPrint} className="bg-slate-900 text-white font-bold text-[10px] px-3 py-1 rounded-lg">
                                Tes Print
                            </button>
                        </div>
                    </div>

                    <div className="bg-white p-3 rounded-xl shadow-sm border border-slate-200 space-y-2">
                        <h3 className="font-bold text-slate-800 text-xs border-b pb-1.5 flex items-center space-x-1">
                            <i className="fa-solid fa-store text-blue-600"></i>
                            <span>Identitas Struk</span>
                        </h3>

                        <div className="space-y-2 text-[11px]">
                            <div>
                                <label className="text-slate-600 font-semibold block mb-0.5">Nama Bengkel</label>
                                <input
                                    type="text"
                                    value={settings.storeName}
                                    onChange={(e) => handleChange('storeName', e.target.value)}
                                    className="w-full px-2 py-1 border rounded font-semibold"
                                />
                            </div>
                            <div>
                                <label className="text-slate-600 font-semibold block mb-0.5">Alamat</label>
                                <input
                                    type="text"
                                    value={settings.storeAddress}
                                    onChange={(e) => handleChange('storeAddress', e.target.value)}
                                    className="w-full px-2 py-1 border rounded font-semibold"
                                />
                            </div>
                            <div>
                                <label className="text-slate-600 font-semibold block mb-0.5">No. Telp</label>
                                <input
                                    type="text"
                                    value={settings.storePhone}
                                    onChange={(e) => handleChange('storePhone', e.target.value)}
                                    className="w-full px-2 py-1 border rounded font-semibold"
                                />
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function ReceiptModal({ transaction, settings, onTriggerPrint, onClose }) {
            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                    <div className="bg-white rounded-xl shadow-2xl max-w-xs w-full p-4 space-y-3 no-print relative">
                        <div className="text-center space-y-0.5 border-b pb-2 border-dashed border-slate-200">
                            <h2 className="font-bold text-sm text-slate-900 uppercase">{settings.storeName}</h2>
                            <p className="text-[10px] text-slate-500">{settings.storeAddress}</p>
                            <p className="text-[10px] text-slate-400 font-mono">{transaction.id} | {new Date(transaction.date).toLocaleDateString('id-ID')}</p>
                        </div>

                        <div className="text-[10px] space-y-0.5 bg-slate-50 p-2 rounded-lg font-mono">
                            <div className="flex justify-between">
                                <span className="text-slate-400">Pelanggan:</span>
                                <span className="font-bold text-slate-800">{transaction.customerName}</span>
                            </div>
                            <div className="flex justify-between">
                                <span className="text-slate-400">Motor/Plat:</span>
                                <span className="font-bold text-slate-800">{transaction.vehicleInfo} ({transaction.plateNumber})</span>
                            </div>
                        </div>

                        <div className="space-y-1 text-[10px] font-mono max-h-32 overflow-y-auto">
                            {transaction.items.map((item, idx) => (
                                <div key={idx} className="flex justify-between border-b pb-0.5 border-slate-100">
                                    <div>
                                        <p className="font-bold text-slate-800 truncate max-w-[120px]">{item.name}</p>
                                        <p className="text-[9px] text-slate-400">{item.qty} x {formatRupiah(item.sellPrice)}</p>
                                    </div>
                                    <span className="font-bold text-slate-800">{formatRupiah(item.qty * item.sellPrice)}</span>
                                </div>
                            ))}
                        </div>

                        <div className="border-t pt-1.5 border-dashed border-slate-200 text-[10px] font-mono space-y-0.5">
                            <div className="flex justify-between font-bold text-slate-800">
                                <span>TOTAL</span>
                                <span>{formatRupiah(transaction.total)}</span>
                            </div>
                            <div className="flex justify-between text-slate-500">
                                <span>Bayar</span>
                                <span>{formatRupiah(transaction.cashPaid)}</span>
                            </div>
                            <div className="flex justify-between text-slate-500">
                                <span>Kembali</span>
                                <span>{formatRupiah(transaction.change)}</span>
                            </div>
                        </div>

                        <div className="flex space-x-2 pt-1">
                            <button onClick={onClose} className="flex-1 py-1.5 bg-slate-100 text-slate-700 font-bold text-xs rounded-lg">
                                Tutup
                            </button>
                            <button onClick={onTriggerPrint} className="flex-1 py-1.5 bg-blue-600 text-white font-bold text-xs rounded-lg shadow">
                                Cetak
                            </button>
                        </div>
                    </div>

                    <div className="hidden print-only thermal-receipt">
                        <div style={{ textAlign: 'center', marginBottom: '4px' }}>
                            <strong style={{ fontSize: '11px', display: 'block', textTransform: 'uppercase' }}>{settings.storeName}</strong>
                            <span style={{ fontSize: '8px', display: 'block' }}>{settings.storeAddress}</span>
                            <span style={{ fontSize: '8px', display: 'block' }}>Telp: {settings.storePhone}</span>
                            <div style={{ borderBottom: '1px dashed #000', margin: '3px 0' }}></div>
                        </div>

                        <div style={{ fontSize: '8px', marginBottom: '4px' }}>
                            <div>No: {transaction.id}</div>
                            <div>Tgl: {new Date(transaction.date).toLocaleString('id-ID')}</div>
                            <div>Pelanggan: {transaction.customerName}</div>
                            <div>Plat/Motor: {transaction.plateNumber} / {transaction.vehicleInfo}</div>
                            <div style={{ borderBottom: '1px dashed #000', margin: '3px 0' }}></div>
                        </div>

                        <div style={{ fontSize: '8px', marginBottom: '4px' }}>
                            {transaction.items.map((item, i) => (
                                <div key={i} style={{ marginBottom: '2px' }}>
                                    <div style={{ fontWeight: 'bold' }}>{item.name}</div>
                                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                        <span>{item.qty} x {formatRupiah(item.sellPrice)}</span>
                                        <span>{formatRupiah(item.qty * item.sellPrice)}</span>
                                    </div>
                                </div>
                            ))}
                            <div style={{ borderBottom: '1px dashed #000', margin: '3px 0' }}></div>
                        </div>

                        <div style={{ fontSize: '8px', textAlign: 'right' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                <span>Subtotal:</span>
                                <span>{formatRupiah(transaction.subtotal)}</span>
                            </div>
                            {transaction.discount > 0 && (
                                <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                    <span>Diskon:</span>
                                    <span>-{formatRupiah(transaction.discount)}</span>
                                </div>
                            )}
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontWeight: 'bold', fontSize: '10px', marginTop: '2px' }}>
                                <span>TOTAL:</span>
                                <span>{formatRupiah(transaction.total)}</span>
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                <span>Bayar:</span>
                                <span>{formatRupiah(transaction.cashPaid)}</span>
                            </div>
                            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                <span>Kembali:</span>
                                <span>{formatRupiah(transaction.change)}</span>
                            </div>
                            <div style={{ borderBottom: '1px dashed #000', margin: '3px 0' }}></div>
                        </div>

                        <div style={{ textAlign: 'center', fontSize: '8px', marginTop: '4px', whitespace: 'pre-line' }}>
                            {settings.receiptFooter}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }
    </script>
</body>
</html>
